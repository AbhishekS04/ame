name: Release

# A tag like v2.2.4 builds the signed APKs and leaves them on a draft release:
# one per ABI and a universal one.
# The notes are still written by hand, and publishing the draft is still a
# person's decision. Run by hand, it builds and signs the same way but only
# keeps the APK as an artifact, which is how the setup can be tried without
# a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Public certificate identity of ame-release.jks. This is not a secret;
      # it prevents CI from publishing an APK signed by an unexpected key.
      EXPECTED_SIGNING_CERT_SHA256: '00:28:86:69:86:EB:5B:AA:58:54:BF:0C:E0:42:BE:8F:51:C5:C1:D2:46:77:26:4D:A3:85:68:C0:0D:43:EE:DF'
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: version
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          echo "name=$version" >> "$GITHUB_OUTPUT"
          # A tag that says one version over a build that says another would
          # publish an update the app then offers again forever.
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match versionName $version"
            exit 1
          fi

      - uses: ./.github/actions/setup

      # The keystore goes to the runner's temporary directory, outside the
      # checkout, and the runner is thrown away when the job ends.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::the signing secrets are not set"
            exit 1
          fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/ame-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/ame-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          chmod 600 "$RUNNER_TEMP/ame-release.jks" keystore.properties

      - name: Build
        run: ./gradlew :app:assembleRelease --stacktrace

      # Without the right key an update does not install over the app people
      # already have. The build now fails when the production key is missing,
      # and this step checks the certificate against the established release
      # certificate rather than merely checking that some signature exists.
      #
      # The apksigner is the one from the build-tools the setup installs, not
      # whichever is newest on the runner, and what it prints is shown: a
      # certificate is public, anyone can read it off the APK, and the first
      # run failed here with nothing to go on.
      #
      # Every split is checked, and copied under the name the app's updater
      # looks for: it picks the one naming the phone's ABI, then "universal".
      - name: Check the signature
        run: |
          set -o pipefail
          for abi in arm64-v8a armeabi-v7a universal; do
            apk=app/build/outputs/apk/release/app-$abi-release.apk
            certs=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk")
            echo "$certs"
            digest=$(echo "$certs" | sed -n 's/^Signer.*certificate SHA-256 digest: //p' | head -n 1)
            if [ -z "$digest" ]; then
              echo "::error::$abi is not signed"
              exit 1
            fi
            actual=$(echo "$digest" | tr -d ':' | tr '[:lower:]' '[:upper:]')
            expected=$(echo "$EXPECTED_SIGNING_CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')
            if [ "$actual" != "$expected" ]; then
              echo "::error::$abi is signed by an unexpected certificate"
              exit 1
            fi
            cp "$apk" "ame-${{ steps.version.outputs.name }}-$abi.apk"
          done

      - name: Draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        # arm64 first, and on its own: the updater in 2.4.2 and earlier takes
        # the first APK it finds, every phone that has one of those is 64-bit,
        # and gh uploads several files at once in no fixed order.
        run: |
          name="ame-${{ steps.version.outputs.name }}"
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          This release improves audio fidelity resolution and playback reliability.

          Highlights
          - Strengthened lossless stream matching using verified title, artist, and duration metadata.
          - Bound fidelity activation to the active decoded stream so lossless status is not shown for prefetched or fallback audio.
          - Improved external stream caching, prefetching, retry handling, and standard-quality fallback behavior.
          - Improved playback stability across queue transitions and network interruptions.
          NOTES
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "v${{ steps.version.outputs.name }}" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release upload "$GITHUB_REF_NAME" "$name-arm64-v8a.apk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$name-arm64-v8a.apk" --draft \
              --title "v${{ steps.version.outputs.name }}" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$GITHUB_REF_NAME" "$name-armeabi-v7a.apk" "$name-universal.apk" --clobber

      - uses: actions/upload-artifact@v7
        if: github.ref_type != 'tag'
        with:
          name: ame-${{ steps.version.outputs.name }}-signed
          path: ame-${{ steps.version.outputs.name }}-*.apk
          retention-days: 7
          if-no-files-found: error
